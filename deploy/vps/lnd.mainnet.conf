# LND — MAINNET via neutrino light client (no bitcoind needed).
# Swap this in as /home/lnd/.lnd/lnd.conf per deploy/vps/FUNDING.md §0.

[Application Options]
alias=cpt-tipjar
listen=0.0.0.0:9735
restlisten=127.0.0.1:8080
debuglevel=info
# Fee estimates without a full node:
feeurl=https://nodes.lightning.computer/fees/v1/btc-fee-estimates.json

[Bitcoin]
bitcoin.mainnet=1
bitcoin.node=neutrino

[neutrino]
neutrino.addpeer=btcd-mainnet.lightning.computer
# Add more compact-filter peers if sync is slow — see LND neutrino docs.
