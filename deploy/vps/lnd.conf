# LND — signet via local bitcoind. RPC password injected by install.sh.

[Application Options]
alias=cpt-tipjar
listen=0.0.0.0:9735
restlisten=127.0.0.1:8080
debuglevel=info

[Bitcoin]
bitcoin.signet=1
bitcoin.node=bitcoind

[Bitcoind]
bitcoind.rpchost=127.0.0.1
bitcoind.rpcuser=cpt
bitcoind.rpcpass=__RPC_PASS__
bitcoind.zmqpubrawblock=tcp://127.0.0.1:28332
bitcoind.zmqpubrawtx=tcp://127.0.0.1:28333

# --- mainnet flip (later, after signet works):
#   1. In [Bitcoin]: replace bitcoin.signet=1 with bitcoin.mainnet=1
#   2. Either keep bitcoind (edit bitcoin.conf to mainnet, ~15 GB pruned sync)
#      or go light: bitcoin.node=neutrino and add
#        [neutrino]
#        neutrino.addpeer=btcd-mainnet.lightning.computer
#   3. New network = new wallet/macaroons under .../chain/bitcoin/mainnet/
